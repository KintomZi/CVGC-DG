# @Note : STPLS3D to Toronto-3D&DALES

file:
  #存放训练的数据文件夹
  folder_train: '/home/huiwei/Desktop/autodl-tmp/sim2real/STPLS3D/train_S50(0)-50(0)'
  #存放测试的数据文件夹
  folder_test: '/home/huiwei/Desktop/autodl-tmp/sim2real/DALES/test_S50(0)-50(0)'
  #存放pth和log的文件夹
  result_folder: '/home/huiwei/Desktop/Code/result_temp/DGLSS'

env:
  seed: 2024
  num_workers: 10 # 处理的线程数

dataset:
  center_type: -1 # 点云的原点坐标的选取
  # - 0: 三维的坐标均值中心
  # - 1：二维平面的均值中心，z轴不改变
  # - 2：1m/bin中点数量<1000的首个bin中心
  voxel_size: 0.3
  aug_parameter: 'DGLSS' # 'Mix3D' 'GrowSP'
  # 地面(0),建筑物/人造物(1),植被(2),车(3),杆柱(4),栅栏(5),
  label_to_names:
    -1: undefined
    0: Ground
    1: Building
    2: Tree
    3: Car
    4: Light pole
    5: Fence
  ignore_label:
    - -1  # 必须存在,无效标签

model:
  train_epoch: 100
  train_batch_size: 4
  val_batch_size: 2
  test_batch_size: 2
  test_interval: 10 # 每隔多少个epoch测试一次

  learning_rate: 0.001 # optimizer
  # scheduler参数，由于方法多样性无法固定，在代码里面配置

  input_features_dim: 3
  output_class_dim: 6
