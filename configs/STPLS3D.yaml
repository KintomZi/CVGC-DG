# @Note : STPLS3D to Toronto-3D&DALES

file:
  # Folder containing training data
  folder_train: '/home/huiwei/Desktop/autodl-tmp/sim2real/STPLS3D/train_S50(0)-50(0)'
  # Folder containing test data
  folder_test: '/home/huiwei/Desktop/autodl-tmp/sim2real/DALES/test_S50(0)-50(0)'
  # Folder for saving model checkpoints (.pth) and log files
  result_folder: '/home/huiwei/Desktop/Code/result_temp/STPLS3D'

env:
  seed: 2024  # Random seed for reproducibility
  num_workers: 10  # Number of worker processes for DataLoader

dataset:
  center_type: -1  # Method for selecting point cloud origin coordinate
  # -1: Minimum value of 3D coordinates (min-x, min-y, min-z)
  #  0: Centroid of 3D coordinates (mean of x, y, z)
  #  1: Centroid of XY plane only, Z-axis remains unchanged
  #  2: Center of the first 1m bin with point count < 1000 (binning along Z-axis)
  
  voxel_size: 0.3  # Voxel size for sparse voxelization (meters)
  aug_parameter: 'DGLSS'  # Data augmentation strategy: 'Mix3D' | 'GrowSP' | 'DGLSS'
  
  label_to_names:
    -1: undefined # Invalid/ignored label
    0: Ground
    1: Building
    2: Tree
    3: Car
    4: Light pole
    5: Fence
  ignore_label:
    - -1  # Required: labels to be ignored during loss computation (must include -1)

model:
  train_epoch: 100 # Total number of training epochs
  train_batch_size: 4  # Batch size for training
  val_batch_size: 2  # Batch size for validation
  test_batch_size: 2 # Batch size for testing
  test_interval: 10  # Evaluation frequency: run test every N epochs

  learning_rate: 0.001  # Initial learning rate for optimizer
  
  # Scheduler parameters: configured dynamically in code due to method diversity
  # (e.g., StepLR, CosineAnnealingLR, ReduceLROnPlateau, etc.)

  input_features_dim: 3  # Input feature dimension (e.g., XYZ coordinates)
  output_class_dim: 6  # Number of output semantic classes (excluding ignored labels)
